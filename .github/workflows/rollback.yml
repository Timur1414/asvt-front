name: Rollback Frontend

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target Docker Tag or Commit SHA to rollback to (e.g. 7-char short SHA or full commit SHA)'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag Frontend image to latest
        run: |
          echo "Retagging timur1414/asvt-front:${{ inputs.target_tag }} as :latest on Docker Hub..."
          docker buildx imagetools create \
            timur1414/asvt-front:${{ inputs.target_tag }} \
            --tag timur1414/asvt-front:latest

      - name: Rollback summary
        run: |
          echo "### Rollback Completed Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Tag/SHA:** \`${{ inputs.target_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** \`frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker Hub \`timur1414/asvt-front:latest\` now points to \`${{ inputs.target_tag }}\`." >> $GITHUB_STEP_SUMMARY
          echo "Watchtower will automatically detect the new image digest on the server and update the frontend container." >> $GITHUB_STEP_SUMMARY
