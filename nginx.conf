user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    resolver 127.0.0.11 valid=10s;

    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;
    types_hash_max_size 2048;
    client_max_body_size 5M;
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_comp_level 5;

    server {
        listen 80;
        server_name money-first.ru;

        location /stub_status {
            stub_status on;
            access_log off;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            allow 172.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
        }
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /api/detection {
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            set $backend_api "http://api:8080";
            proxy_pass $backend_api;
        }
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name money-first.ru;

        ssl_certificate /etc/letsencrypt/live/money-first.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/money-first.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location ~ /\. {
            deny all;
        }
        location ~ /(README\.md|\.git$) {
            deny all;
        }
        location /hls/ {
            proxy_pass http://95.163.220.75:8888/;  # надо заменить из-за запуска mediamtx не из докера
        }
        location /api/ {
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            set $backend_api "http://api:8080";
            proxy_pass $backend_api;
        }
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public";
        }
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
            add_header Expires 0;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
